<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form - Homework 27</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Registration</h1>

      <form id="registration-form" novalidate>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" />
          <small id="email-error" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" />
          <small id="password-error" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password:</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
          />
          <small id="confirm-password-error" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" />
          <small id="age-error" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="city">City:</label>
          <select id="city" name="city">
            <option value="">Select a city</option>
            <option value="kyiv">Kyiv</option>
            <option value="lviv">Lviv</option>
            <option value="odessa">Odessa</option>
          </select>
          <small id="city-error" class="error-message"></small>
        </div>

        <div class="form-group">
          <label class="checkbox-label" for="terms">
            <input type="checkbox" id="terms" name="terms" />
            I agree to the terms
          </label>
          <small id="terms-error" class="error-message"></small>
        </div>

        <div class="buttons">
          <button type="submit">Register</button>
          <button type="button" id="reset-button">Clear</button>
        </div>
      </form>

      <pre id="form-result"></pre>
    </main>
  </body>
</html>
